<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Classic Pac-Man arcade game — playable offline" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pac-Man</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        color: #fff;
        font-family: 'Press Start 2P', monospace, sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      canvas#game-canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      #overlay > * {
        pointer-events: auto;
      }

      :focus-visible {
        outline: 2px solid #ffff00;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="overlay" role="region" aria-label="Game screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
